# Cloud Build for buyback-web-staging (no local Docker required)
# Usage: gcloud builds submit . --config=scripts/cloudbuild-web-staging.yaml --substitutions=...

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - "--build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FB_API_KEY}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FB_AUTH_DOMAIN}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FB_PROJECT_ID}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FB_BUCKET}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FB_SENDER}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FB_APP_ID}"
      - "--build-arg=NEXT_PUBLIC_APP_URL=${_APP_URL}"
      - "-t"
      - "us-central1-docker.pkg.dev/trading-card-buyback-dev/buyback/buyback-web-staging:latest"
      - "."
    dir: web

images:
  - us-central1-docker.pkg.dev/trading-card-buyback-dev/buyback/buyback-web-staging:latest

options:
  logging: CLOUD_LOGGING_ONLY
