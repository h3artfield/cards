# Cloud Build for discord-inventory-bot (always-on Discord listener)
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-f"
      - "Dockerfile.discord-inventory-bot"
      - "-t"
      - "us-central1-docker.pkg.dev/trading-card-buyback-dev/buyback/discord-inventory-bot:latest"
      - "."
    dir: web

images:
  - us-central1-docker.pkg.dev/trading-card-buyback-dev/buyback/discord-inventory-bot:latest

options:
  logging: CLOUD_LOGGING_ONLY
