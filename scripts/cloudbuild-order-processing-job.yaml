# Cloud Build for order-processing-job (Directive 008)
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-f"
      - "Dockerfile.order-processing-job"
      - "-t"
      - "us-central1-docker.pkg.dev/trading-card-buyback-dev/buyback/order-processing-job:latest"
      - "."
    dir: web

images:
  - us-central1-docker.pkg.dev/trading-card-buyback-dev/buyback/order-processing-job:latest

options:
  logging: CLOUD_LOGGING_ONLY
